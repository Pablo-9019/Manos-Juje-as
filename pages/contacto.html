        <form>
          <section class="section" id="contacto">
           <h2 class="title">Contacto</h2>
              <div class="contact-box">
            <label for="form-nombre">Nombre</label>
            <input type="text" id="form-nombre" placeholder="nombre completo"><br>
            <label for="form-email">Email</label>
            <input type="email" id="form-email" placeholder="ejemplo@gmail.com"><br>
            <label for="form-text">Texto</label>
            <input type="text" id="form-text"><br>
            <label for="form-tel">Telefono</label>
            <input type="tel" id="form-tel">
            <button class="btn">
                Enviar Mensaje
            </button>
              </div>
          </section>
        </form>
    </main>
    <footer></footer>
